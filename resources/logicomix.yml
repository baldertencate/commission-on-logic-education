id: logicomix
title: Logicomix
url: https://www.logicomix.com/en/index8be8.html?option=com_content&view=frontpage&Itemid=53
description: Covering a span of sixty years, the graphic novel Logicomix was inspired by the epic
  story of the quest for the Foundations of Mathematics.
features:
  - This was a heroic intellectual adventure most of whose protagonists paid the price of knowledge
    with extreme personal suffering and even insanity. The book tells its tale in an engaging way,
    at the same time complex and accessible. It grounds the philosophical struggles on the
    undercurrent of personal emotional turmoil, as well as the momentous historical events and
    ideological battles which gave rise to them.
