id: theorem-proving-system-tps-and-the-educational-theorem-proving-system-etps
title: Theorem Proving System (TPS) and the Educational Theorem Proving System (ETPS)
url: https://gtps.math.cmu.edu/tps-about.html
description: The Theorem Proving System (TPS) is an automated theorem-prover for first-order logic
  and type theory. The Educational Theorem Proving System (ETPS) is a cut-down version of TPS
  intended for use by students; it contains only commands relevant to proving theorems interactively
features:
  - Potential applications of automated theorem proving include hardware and software verification,
    partial automation of various mathematical activities, promoting development of formal theories
    in a wide variety of disciplines, deductive information systems for these disciplines, expert
    systems which can reason, and certain aspects of artificial intelligence.
