id: dn-fn
title: DN-FN
url: http://patrice.bailhache.free.fr/dnfn/deductioneng.html
description: Program to learn Natural Deduction in Gentzen-Kleene’s style
features:
  - The disk contains two programs, DN and FN, intended to provide some help in teaching Natural
    Deduction (in Gentzen’s style) and Normal Forms calculation. They are written in Pascal for PC
    computers. The primitive idea was to have at disposal a true and intelligent deriver, being able
    to calculate and provide (on a printer) fair copies for exercises carried out for a long time at
    the University of Nantes.
