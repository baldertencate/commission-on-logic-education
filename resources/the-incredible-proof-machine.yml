id: the-incredible-proof-machine
title: The Incredible Proof Machine
url: https://incredible.pm/
description: Tool to perform proofs in various logics (e.g. propositional, predicate logic) visually
features:
  - You simply add blocks that represent the various proofs steps, connect them properly, and if the
    conclusion turns green, then you have created a complete proof! Simply drag and drop to connect
    two dots; for some examples of completed proofs, see this paper.
