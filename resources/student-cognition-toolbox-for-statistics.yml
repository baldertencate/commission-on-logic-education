id: student-cognition-toolbox-for-statistics
title: Student Cognition Toolbox for Statistics
url: https://oli.cmu.edu/courses/statistics-study-skills-the-student-cognition-toolbox-open-free/
description: The Student Cognition Toolbox (SCT) is a short course companion (or “sidecar”)
  introducing and providing direct practice in study strategies that are informed by learning
  science research. In this version of the SCT, material from introductory statistics is used to
  illustrate the application of the study strategies. This version gives examples and
  recommendations specifically for students studying Introductory Statistics.
