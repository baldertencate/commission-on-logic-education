id: hintikka-s-world
title: Hintikka’s world
url: http://hintikkasworld.irisa.fr/
description: This website shows intelligent artificial agents reasoning about higher-order knowledge
  (a knows that b knows that…). It enables to explore mental states of the agents by clicking on
  them. It contains many classical AI examples.
features:
  - "This tool can be used for: Learning modal logic. Model checking and satisfiability problem.
    Learning models of dynamic epistemic logic. Having fun with epistemic puzzles."
