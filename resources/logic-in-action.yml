id: logic-in-action
title: Logic in Action
url: https://www.logicinaction.org/
description: |-
  Open course in logic.
  Developed to provide a modern introduction to the field of logic with topics reflecting both its mathematical essentials and a broad view of its interdisciplinary role.
features:
  - Online and PDF version of the textbook
  - Slides for teaching available, in English and in Spanish (made by Fernando Velazquez Quesada).
  - Further exercise material for the chapters (courtesy of Dora Achourioti, AUC).
  - Online exercises in modal logic.
