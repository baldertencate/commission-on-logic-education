id: causal-and-statistical-reasoning
title: Causal and Statistical Reasoning
url: https://oli.cmu.edu/courses/causal-and-statistical-reasoning-open-free/
description: "An introduction to causal and statistical reasoning, this course is meant for students
  interested in critical thinking skills for daily life, students who will take a few statistics
  courses in service of a related field of study, and/or students interested in the foundations of
  quantitative causal models: called Bayes Networks."
features:
