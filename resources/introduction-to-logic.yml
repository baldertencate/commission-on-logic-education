id: introduction-to-logic
title: Introduction to Logic
url: http://logic.philosophy.ox.ac.uk/
description: This website provides, through a range of materials and tools, an introduction to the
  study of elementary logic covering propositional and predicate calculus. It is hoped that the site
  may be useful more widely, for anyone who would like to investigate the subject. The material here
  is intended to be used in conjunction with Wilfrid Hodges’ Logic. This text was used for the
  Introduction to Logic course until 2008, when Hodges’ text was replaced with the Logic Manual as
  set text.
