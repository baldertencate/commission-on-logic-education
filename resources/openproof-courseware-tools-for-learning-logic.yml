description: The Openproof project at Stanford’s Center for the Study of Language and Information
  (CSLI) is concerned with the application of software to problems in logic. Since the early 1980’s
  we have been developing applications in logic education which are both innovative and effective.
  The development of these courseware packages has in turn informed and influenced our research
  agenda.
