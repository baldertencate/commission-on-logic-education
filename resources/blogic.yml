id: blogic
title: Blogic
url: https://weblogic.a2hosted.com/Logic/
description: This book explores the deep structure of thought and language. It will not teach you
  how to think or how to speak, but it will teach you how to think and speak about thinking and
  speaking — how to analyze and discuss them in terms of universal principles by which they are
  governed. These principles play an especially important role in reasoning — the reasoning that we
  do in our heads, when we think, and the reasoning that we do aloud when we argue for a conclusion.
