id: linear-logic-prover
title: Linear Logic Prover
url: https://cspsat.gitlab.io/llprover/
description: This small program searches a cut-free proof of the given two-sided sequent of
  first-order linear logic.
features:
  - The proof search of linear logic is undecidable. Therefore, this program limits the number of
    contraction rules for each path of the proof at most three (this threshold value can be
    changed).
types:
  - solver
topics:
  - predicate-logic
  - proof-theory
languages:
