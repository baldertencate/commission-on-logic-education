id: athena-programming-language-old-version-with-exercises-athena
title: "Athena Programming Language (Old version with exercises: Athena)"
url: https://athena-lang.org/
description: "Athena is a programming language and an interactive theorem proving environment rolled
  in one. (1) As a programming language, Athena is a higher-order functional language in the
  tradition of Scheme and ML: strict and lexically scoped. (2) As a theorem proving system, Athena
  is based on many-sorted first-order logic."
features:
  - Combining expressivity and simplicity. True natural-deduction style. Conditional and Equational
    Rewriting. Built-in Proof Automation. Proof Reuse and Custom Tactics. Flexible Module System.
    Extensible notation. Abstract-level proofs and structured theories
