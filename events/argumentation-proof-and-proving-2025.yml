title: "Argumentation, Proof, and Proving"
description: |-
  **Instructors:** Dr Knipping and Dr Papadaki, University of Bremen

  **Meetings:** Beginning 7 November 2025, 08:00–10:00 CET, and continuing every two weeks through 6 February 2026. Meetings used Zoom ID 616 4799 4734.

  ## Course information

  The course examined the divide between formal proof in university mathematics and proof in school and applied mathematics. Formal proofs are often difficult to understand, while school mathematics is generally not organised as an axiomatic system. This contributes to the discontinuity between school and university mathematics described by Felix Klein.

  The course therefore approached proof as more than a collection of formal deductions. It emphasised proving, mathematical argumentation, reasoning, and the social processes through which proofs are negotiated and accepted in classrooms and mathematical communities.

  Participants studied significant publications on proof, proving, and reasoning in mathematics education. The course considered educational and cultural settings from primary and secondary school to university and engineering programmes, and compared theoretical frameworks for understanding what a mathematical proof can be.

  Active reading and participation in the biweekly discussions were expected. Master's and doctoral students seeking credit also designed a research-grounded learning environment for proof and proving in a chosen educational context. The course was open to other colleagues interested in discussing these issues with students and scholars.

  **Reference:** Felix Klein, *Elementary Mathematics from a Higher Standpoint: Arithmetic, Algebra, Analysis* (Dover, 1932; originally published in 1908).
