id: student-language-and-mathematical-logic-2025
title: "What aspects of student language use do not comport with mathematical logic?"
description: |-
  **Speaker:** Paul Christian Dawkins, Professor of Mathematics at Texas State University

  **Times:** 08:00 in Dallas, 10:00 in Brasilia, 15:00 in Paris, 18:30 in Bangalore, and 21:00 in Beijing

  ## Abstract

  Drawing on more than a decade of experiments helping university students reflect on mathematical language and reconstruct basic logical structures, Dawkins presented observations about students' informal interpretations of mathematical language.

  Combining these empirical findings with ideas from psychology, pragmatics, and linguistics, he described students' language use as coherent and rational even when it conflicts with formal logical structure.

  Examples of student thinking illustrated important differences between informal and mathematical language. The talk considered how recognising those differences can help instructors and researchers understand the challenges logic education must overcome when supporting students in formalising and systematising their reasoning.
