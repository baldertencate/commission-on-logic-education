id: tools-for-teaching-logic-webinar-2025
title: "Webinar on logic education: Tools for Teaching Logic"
description: |-
  **Speaker:** Professor María Manzano

  **Times:** 10:00 in New York, 14:00 GMT, 16:00 in Amsterdam, 19:30 in Bangalore, and 22:00 in Beijing

  ## Abstract

  Manzano discussed the European ALFA Tools for Teaching Logic project and the International TTL Congresses held in 2000, 2006, 2011, 2015, and 2023.

  The interdisciplinary Aracne network brought together professors and researchers from philosophy, mathematics, computer science, and linguistics. Its plans included:

  - preparing a metabook with a hypertext version;
  - creating an online dictionary of logic terms;
  - investigating software for teaching logic;
  - translating elementary and interdisciplinary texts and software;
  - supporting authors who wished to write lecture notes;
  - sharing the project within academia and with secondary schools; and
  - supporting women's participation in higher education.

  Some results were published through the [Aracne website](https://aracne.usal.es/) and the Summa Logicae digital library.

  ## Speaker biography

  María Gracia Manzano Arjona is a philosopher specialising in mathematical logic and model theory. She earned her doctorate at the University of Barcelona in 1977 under the supervision of Jesús Mosterín. She is a professor of logic and philosophy of science at the University of Salamanca and has written several books on logic and model theory.
